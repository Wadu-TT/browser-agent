# Render.com deployment configuration
# See: https://render.com/docs/render-yaml-spec

services:
  - type: web
    name: browser-agent
    runtime: docker
    plan: free
    region: oregon

    # Build from Dockerfile in project root
    dockerfilePath: ./Dockerfile

    # Environment variables (set GROQ_API_KEY in Render dashboard)
    envVars:
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: MAX_STEPS
        value: "20"
      - key: HEADLESS
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: GROQ_API_KEY
        sync: false    # Set this manually in Render dashboard

    # Health check endpoint
    healthCheckPath: /health

    # Auto-deploy on push to main branch
    autoDeploy: true
